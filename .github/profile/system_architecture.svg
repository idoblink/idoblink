<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="100%" height="130">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#0f111a" />
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="878" height="128" rx="12" fill="url(#cardBg)" stroke="#1e2333" stroke-width="1.2" />

  <!-- Section Label -->
  <text x="32" y="24" fill="#64748b" class="mono" font-size="9.5" font-weight="600" letter-spacing="1">SYSTEM ARCHITECTURE LIFECYCLE</text>

  <!-- Flow Arrows connecting the 5 nodes -->
  <line x1="172" y1="74" x2="198" y2="74" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="338" y1="74" x2="364" y2="74" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="504" y1="74" x2="530" y2="74" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="670" y1="74" x2="696" y2="74" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Node 1: Ingestion -->
  <g transform="translate(32, 40)">
    <rect x="0" y="0" width="138" height="66" rx="8" fill="#131622" stroke="#22283a" stroke-width="1" />
    <text x="14" y="22" fill="#94a3b8" class="mono" font-size="9" font-weight="600">01 / INGESTION</text>
    <text x="14" y="40" fill="#f1f5f9" class="sans" font-size="12" font-weight="600">Raw Signals</text>
    <text x="14" y="54" fill="#64748b" class="sans" font-size="10">Audio, Video, Sockets</text>
  </g>

  <!-- Node 2: Extraction -->
  <g transform="translate(198, 40)">
    <rect x="0" y="0" width="138" height="66" rx="8" fill="#131622" stroke="#22283a" stroke-width="1" />
    <text x="14" y="22" fill="#94a3b8" class="mono" font-size="9" font-weight="600">02 / PIPELINE</text>
    <text x="14" y="40" fill="#f1f5f9" class="sans" font-size="12" font-weight="600">Pre-processing</text>
    <text x="14" y="54" fill="#64748b" class="sans" font-size="10">OpenCV · OCR · Win32</text>
  </g>

  <!-- Node 3: Model Core (Highlighted) -->
  <g transform="translate(364, 40)">
    <rect x="0" y="0" width="138" height="66" rx="8" fill="#171b2d" stroke="#4f46e5" stroke-width="1.2" />
    <text x="14" y="22" fill="#818cf8" class="mono" font-size="9" font-weight="600">03 / INFERENCE</text>
    <text x="14" y="40" fill="#ffffff" class="sans" font-size="12" font-weight="600">Deep Learning</text>
    <text x="14" y="54" fill="#94a3b8" class="sans" font-size="10">PyTorch · YOLO · AVSE</text>
  </g>

  <!-- Node 4: Application -->
  <g transform="translate(530, 40)">
    <rect x="0" y="0" width="138" height="66" rx="8" fill="#131622" stroke="#22283a" stroke-width="1" />
    <text x="14" y="22" fill="#94a3b8" class="mono" font-size="9" font-weight="600">04 / APPLICATION</text>
    <text x="14" y="40" fill="#f1f5f9" class="sans" font-size="12" font-weight="600">Interface &amp; API</text>
    <text x="14" y="54" fill="#64748b" class="sans" font-size="10">FastAPI · React · C# WPF</text>
  </g>

  <!-- Node 5: Deployment -->
  <g transform="translate(696, 40)">
    <rect x="0" y="0" width="150" height="66" rx="8" fill="#131622" stroke="#22283a" stroke-width="1" />
    <text x="14" y="22" fill="#94a3b8" class="mono" font-size="9" font-weight="600">05 / PRODUCTION</text>
    <text x="14" y="40" fill="#f1f5f9" class="sans" font-size="12" font-weight="600">Deployment</text>
    <text x="14" y="54" fill="#64748b" class="sans" font-size="10">Docker · Linux Runtime</text>
  </g>
</svg>
