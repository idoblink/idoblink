<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 90" width="100%" height="90">
  <defs>
    <linearGradient id="metricBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#0f111a" />
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
  </style>

  <rect x="1" y="1" width="878" height="88" rx="10" fill="url(#metricBg)" stroke="#1e2333" stroke-width="1.2" />

  <!-- Metric 1: Repositories -->
  <g transform="translate(48, 26)">
    <text x="0" y="0" fill="#64748b" class="mono" font-size="9.5" font-weight="600" letter-spacing="1">PUBLIC WORK</text>
    <text x="0" y="28" fill="#f8fafc" class="sans" font-size="22" font-weight="700">17+ <tspan fill="#94a3b8" font-size="12" font-weight="400">Repositories</tspan></text>
  </g>

  <!-- Divider 1 -->
  <line x1="280" y1="20" x2="280" y2="70" stroke="#1e2333" stroke-width="1" />

  <!-- Metric 2: Core Focus -->
  <g transform="translate(320, 26)">
    <text x="0" y="0" fill="#64748b" class="mono" font-size="9.5" font-weight="600" letter-spacing="1">PRIMARY DOMAIN</text>
    <text x="0" y="28" fill="#f8fafc" class="sans" font-size="20" font-weight="700">Deep Learning <tspan fill="#818cf8">&amp;</tspan> Systems</text>
  </g>

  <!-- Divider 2 -->
  <line x1="590" y1="20" x2="590" y2="70" stroke="#1e2333" stroke-width="1" />

  <!-- Metric 3: Engineering Discipline -->
  <g transform="translate(630, 26)">
    <text x="0" y="0" fill="#64748b" class="mono" font-size="9.5" font-weight="600" letter-spacing="1">DISCIPLINE</text>
    <text x="0" y="28" fill="#f8fafc" class="sans" font-size="20" font-weight="700">End-to-End Delivery</text>
  </g>
</svg>
