<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="60%" stop-color="#0d0f17" />
      <stop offset="100%" stop-color="#12141f" />
    </linearGradient>

    <!-- Linear-style Ambient Glow -->
    <radialGradient id="glowIndigo" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowSky" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid -->
    <pattern id="subtleGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />
    </pattern>

    <!-- Linear Accent Rule -->
    <linearGradient id="accentRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Base Card -->
  <rect x="1" y="1" width="878" height="218" rx="14" fill="url(#bg)" stroke="#1e2333" stroke-width="1.2" />
  
  <!-- Subtle Grids and Glows -->
  <rect x="2" y="2" width="876" height="216" rx="13" fill="url(#subtleGrid)" />
  <rect x="2" y="2" width="876" height="216" rx="13" fill="url(#glowIndigo)" />
  <rect x="2" y="2" width="876" height="216" rx="13" fill="url(#glowSky)" />

  <!-- Top Meta Bar -->
  <g transform="translate(36, 34)">
    <!-- Small Status Pill -->
    <rect x="0" y="0" width="108" height="22" rx="11" fill="#181c2b" stroke="#2a324b" stroke-width="0.8" />
    <circle cx="11" cy="11" r="3.5" fill="#10b981" />
    <text x="21" y="15" fill="#94a3b8" class="font-mono" font-size="9.5" font-weight="500" letter-spacing="0.5">OPEN SOURCE</text>

    <!-- Center/Right Details -->
    <text x="124" y="15" fill="#64748b" class="font-mono" font-size="10">·</text>
    <text x="136" y="15" fill="#94a3b8" class="font-mono" font-size="10" font-weight="500">CS &amp; AI/ML @ VVCE</text>
    <text x="270" y="15" fill="#64748b" class="font-mono" font-size="10">·</text>
    <text x="282" y="15" fill="#94a3b8" class="font-mono" font-size="10" font-weight="500">KARNATAKA, INDIA</text>
  </g>

  <!-- Main Name & Title -->
  <g transform="translate(36, 92)">
    <text x="0" y="0" fill="#f8fafc" class="font-sans" font-size="28" font-weight="700" letter-spacing="-0.5">Dhanush H S</text>
    <text x="0" y="26" fill="#94a3b8" class="font-sans" font-size="14.5" font-weight="400">
      Building end-to-end systems across <tspan fill="#e2e8f0" font-weight="600">machine learning</tspan>, <tspan fill="#e2e8f0" font-weight="600">full-stack web</tspan>, and <tspan fill="#e2e8f0" font-weight="600">native Windows</tspan>.
    </text>
  </g>

  <!-- Accent Divider Line -->
  <rect x="36" y="136" width="808" height="1" fill="#1e2333" />
  <rect x="36" y="136" width="180" height="1" fill="url(#accentRule)" />

  <!-- Core Stack Pills along Bottom -->
  <g transform="translate(36, 160)">
    <!-- Pill 1: PyTorch -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="76" height="24" rx="6" fill="#141724" stroke="#23293d" stroke-width="0.8" />
      <text x="38" y="16" fill="#cbd5e1" class="font-mono" font-size="10.5" text-anchor="middle">PyTorch</text>
    </g>
    <!-- Pill 2: Python -->
    <g transform="translate(86, 0)">
      <rect x="0" y="0" width="68" height="24" rx="6" fill="#141724" stroke="#23293d" stroke-width="0.8" />
      <text x="34" y="16" fill="#cbd5e1" class="font-mono" font-size="10.5" text-anchor="middle">Python</text>
    </g>
    <!-- Pill 3: TypeScript -->
    <g transform="translate(164, 0)">
      <rect x="0" y="0" width="94" height="24" rx="6" fill="#141724" stroke="#23293d" stroke-width="0.8" />
      <text x="47" y="16" fill="#cbd5e1" class="font-mono" font-size="10.5" text-anchor="middle">TypeScript</text>
    </g>
    <!-- Pill 4: C# / .NET -->
    <g transform="translate(268, 0)">
      <rect x="0" y="0" width="84" height="24" rx="6" fill="#141724" stroke="#23293d" stroke-width="0.8" />
      <text x="42" y="16" fill="#cbd5e1" class="font-mono" font-size="10.5" text-anchor="middle">C# · .NET</text>
    </g>
    <!-- Pill 5: FastAPI -->
    <g transform="translate(362, 0)">
      <rect x="0" y="0" width="76" height="24" rx="6" fill="#141724" stroke="#23293d" stroke-width="0.8" />
      <text x="38" y="16" fill="#cbd5e1" class="font-mono" font-size="10.5" text-anchor="middle">FastAPI</text>
    </g>
    <!-- Pill 6: React -->
    <g transform="translate(448, 0)">
      <rect x="0" y="0" width="66" height="24" rx="6" fill="#141724" stroke="#23293d" stroke-width="0.8" />
      <text x="33" y="16" fill="#cbd5e1" class="font-mono" font-size="10.5" text-anchor="middle">React</text>
    </g>
    <!-- Pill 7: Docker -->
    <g transform="translate(524, 0)">
      <rect x="0" y="0" width="70" height="24" rx="6" fill="#141724" stroke="#23293d" stroke-width="0.8" />
      <text x="35" y="16" fill="#cbd5e1" class="font-mono" font-size="10.5" text-anchor="middle">Docker</text>
    </g>
    <!-- Pill 8: Win32 API -->
    <g transform="translate(604, 0)">
      <rect x="0" y="0" width="86" height="24" rx="6" fill="#141724" stroke="#23293d" stroke-width="0.8" />
      <text x="43" y="16" fill="#cbd5e1" class="font-mono" font-size="10.5" text-anchor="middle">Win32 API</text>
    </g>
    <!-- Pill 9: OpenCV -->
    <g transform="translate(700, 0)">
      <rect x="0" y="0" width="74" height="24" rx="6" fill="#141724" stroke="#23293d" stroke-width="0.8" />
      <text x="37" y="16" fill="#cbd5e1" class="font-mono" font-size="10.5" text-anchor="middle">OpenCV</text>
    </g>
  </g>
</svg>
